<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- The bird flying past a pipe, over the ground, in the game's colours (js/flappy-bird.js, COLORS) -->
    <rect width="100" height="100" fill="#4ec0ca"/>
    <!-- The pipe, from the ground up, with its rim -->
    <rect x="68" y="58" width="22" height="42" fill="#543847"/>
    <rect x="70" y="58" width="18" height="42" fill="#73bf2e"/>
    <rect x="72" y="58" width="3" height="42" fill="#9ce659"/>
    <rect x="83" y="58" width="3" height="42" fill="#558022"/>
    <rect x="65" y="52" width="28" height="11" fill="#543847"/>
    <rect x="66" y="53" width="26" height="9" fill="#73bf2e"/>
    <rect x="68" y="53" width="3" height="9" fill="#9ce659"/>
    <!-- The ground -->
    <rect y="84" width="100" height="16" fill="#ded895"/>
    <rect y="80" width="100" height="5" fill="#73bf2e"/>
    <rect y="79" width="100" height="1.5" fill="#543847"/>
    <!-- The bird -->
    <g stroke="#543847" stroke-width="2.5">
        <ellipse cx="38" cy="45" rx="20" ry="15" fill="#f7d51d"/>
        <circle cx="47" cy="40" r="7" fill="#fff"/>
        <rect x="45" y="47" width="17" height="6" rx="2.5" fill="#f75a1d"/>
        <rect x="44" y="52" width="15" height="6" rx="2.5" fill="#e8402a"/>
        <ellipse cx="27" cy="45" rx="10" ry="6" fill="#fff7d6"/>
    </g>
    <rect x="48" y="37" width="3.5" height="6" fill="#000"/>
</svg>
