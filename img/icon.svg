        </radialGradient>
    </defs>
    <rect width="100" height="100" rx="12" fill="url(#felt)"/>
    <g transform="rotate(-14 50 58)">
        <rect x="22" y="22" width="40" height="56" rx="4" fill="#fff" stroke="#6f6f6f" stroke-width="1.2"/>
        <path d="M42 63C35 57 28 52 28 45c0-5 3.5-8 7.5-8 3 0 5.2 1.8 6.5 4.3 1.3-2.5 3.5-4.3 6.5-4.3 4 0 7.5 3 7.5 8 0 7-7 12-14 18z" fill="#e00000"/>
