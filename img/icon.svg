<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
    <!-- A T piece in the game's T colour, each block as js/tetris.js drawSquare() draws it: a grey outline, a lighter
         top-left half and a darker bottom-right half, on the board's colour -->
    <rect width="40" height="40" fill="#111"/>
    <rect x="15" y="10" width="10" height="10" fill="purple" shape-rendering="crispEdges"/>
    <path d="M15 10h10L15 20z" fill="#fff" fill-opacity="0.2"/>
    <path d="M25 10v10h-10z" fill="#000" fill-opacity="0.2"/>
    <rect x="15" y="10" width="10" height="10" fill="none" stroke="gray" stroke-width="0.6"/>
    <rect x="5" y="20" width="10" height="10" fill="purple" shape-rendering="crispEdges"/>
    <path d="M5 20h10L5 30z" fill="#fff" fill-opacity="0.2"/>
    <path d="M15 20v10h-10z" fill="#000" fill-opacity="0.2"/>
    <rect x="5" y="20" width="10" height="10" fill="none" stroke="gray" stroke-width="0.6"/>
    <rect x="15" y="20" width="10" height="10" fill="purple" shape-rendering="crispEdges"/>
    <path d="M15 20h10L15 30z" fill="#fff" fill-opacity="0.2"/>
    <path d="M25 20v10h-10z" fill="#000" fill-opacity="0.2"/>
    <rect x="15" y="20" width="10" height="10" fill="none" stroke="gray" stroke-width="0.6"/>
    <rect x="25" y="20" width="10" height="10" fill="purple" shape-rendering="crispEdges"/>
    <path d="M25 20h10L25 30z" fill="#fff" fill-opacity="0.2"/>
    <path d="M35 20v10h-10z" fill="#000" fill-opacity="0.2"/>
    <rect x="25" y="20" width="10" height="10" fill="none" stroke="gray" stroke-width="0.6"/>
</svg>
