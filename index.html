<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <meta name="description" content="The classic block-stacking puzzle game. Rotate and move falling blocks to create complete lines.">
    <link rel="icon" href="img/icon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="img/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="css/game.css">
    <!-- GameHub support, before the game's own scripts: saves, the frame view, and centring the play area -->
    <script src="js/gamehub.js" data-game="tetris"></script>
</head>
<body>
<main class="game-container">
    <h1>TETRIS GAME</h1>
    <div class="game-area">
        <canvas id="tetris" width="300" height="600" data-play-area role="img" aria-label="The Tetris board"></canvas>
        <div class="game-info">
            <div class="score-box">
                <div><h2>Score</h2><span id="score">0</span></div>
                <div><h2>Best</h2><span id="best-score">0</span></div>
            </div>
            <div class="level-box"><h2>Level</h2><span id="level">1</span></div>
            <div class="lines-box"><h2>Lines</h2><span id="lines">0</span></div>
            <div class="next-piece-box">
                <h2>Next</h2>
                <canvas id="next-piece" width="100" height="100" role="img" aria-label="The next piece"></canvas>
            </div>
            <div class="instructions">
                <h2>Controls</h2>
                <p><b>A | &larr;</b> Move Left</p>
                <p><b>D | &rarr;</b> Move Right</p>
                <p><b>S | &darr;</b> Move Down</p>
                <p><b>W | &uarr;</b> Rotate</p>
                <p><b>Space</b> Drop</p>
                <p><b>Enter</b> Start</p>
                <p><b>P</b> Pause</p>
            </div>
            <div class="game-controls">
                <button id="move-left" aria-label="Move left">&#8678;</button>
                <button id="move-right" aria-label="Move right">&#8680;</button>
                <button id="rotate" aria-label="Rotate">&#8682;</button>
                <button id="move-down" aria-label="Move down">&#8681;</button>
                <button id="drop" aria-label="Drop">&DownArrowBar;</button>
            </div>
            <div class="controls">
                <button id="start-button">Start (p)</button>
                <button id="reset-button">Reset Game (r)</button>
                <button id="instructions-button">Show Instructions (i)</button>
            </div>
        </div>
    </div>
    <!-- JavaScript for this page -->
    <script src="js/buttons-handler.js"></script>
    <script src="js/extend-controls.js"></script>
</main>
<footer style="display: none">&copy; Dany | TetrisGame | 2025-2026 <hr> <a href="https://github.com/DanyilT/dt-games/tree/tetris">source code</a></footer>
<!-- Tetris Game Code -->
<script src="js/storage.js"></script>
<script src="js/rules.js"></script>
<script src="js/tetris.js"></script>
<!-- Very important script -->
<script src="js/qwerty.js"></script>
</body>
</html>
