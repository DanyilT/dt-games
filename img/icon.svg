<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- A game in pencil on notebook paper: the ruled lines and the red margin, the grid, an X, an O, and an X (the
         game's colours, css/page.css) -->
    <rect width="100" height="100" rx="8" fill="#fffdf6"/>
    <g stroke="#c3d7ea" stroke-width="1">
        <path d="M0 20.5h100M0 40.5h100M0 60.5h100M0 80.5h100"/>
    </g>
    <path d="M12 0v100" stroke="#eaa5a5" stroke-width="1.5"/>
    <g fill="none" stroke="#3f3f42" stroke-width="3.5" stroke-linecap="round">
        <!-- The grid, a little uneven -->
        <path d="M41 14Q39.5 50 41.5 87M66 13Q67.5 50 65.5 86M18 38.5Q53 36.5 89 39M17.5 63Q53 64.5 88.5 62"/>
        <!-- X top left, O in the middle, X bottom right -->
        <path d="M22 18.5L35 32.5M35.5 18L21.5 32"/>
        <path d="M53.5 44C47 44.5 46 56.5 53.5 57C61 57.5 61.5 44 53 44.5"/>
        <path d="M72.5 68.5L85 81.5M85.5 68L71.5 81"/>
    </g>
</svg>
