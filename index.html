<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <meta name="description" content="Classic Snake game where you control a snake to eat food and grow longer. Avoid hitting the walls or yourself!">
    <link rel="icon" href="img/icon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="img/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="css/game.css">
    <!-- GameHub support, before the game's own scripts: saves, the frame view, and centring the play area -->
    <script src="js/gamehub.js" data-game="snake"></script>
</head>
<body>
<main class="game-container">
    <h1>Snake Game</h1>
    <canvas id="game" width="400" height="400" data-play-area></canvas>
    <div class="score-container">
        <p>Score: <span id="score">0</span></p>
        <p>High Score: <span id="highScore">0</span></p>
    </div>
    <div class="controls">
        <button id="restartBtn">Restart Game (r)</button>
        <button id="pauseBtn">Pause Game (space)</button>
        <button id="showInstructionsBtn">Show Instructions (i)</button>
    </div>
    <aside class="instructions">
        <h2>How to Play:</h2>
        <p>Use arrow keys to control the snake.</p>
        <p>Eat the food to grow longer and earn points.</p>
        <p>Avoid hitting the walls or your own tail!</p>
        <hr>
        <p>Press "SPACE" to pause the game.</p>
        <p>Press "R" to restart the game.</p>
    </aside>
    <!-- JavaScript for this page -->
    <script src="js/buttons-handler.js"></script>
    <script src="js/extend-controls.js"></script>
</main>
<footer style="display: none">&copy; Dany | SnakeGame | 2025-2026 <hr> <a href="https://github.com/DanyilT/dt-games/tree/snake">source code</a></footer>
<!-- Snake Game Code -->
<script src="js/storage.js"></script>
<script src="js/rules.js"></script>
<script src="js/snake.js"></script>
<!-- Very important script -->
<script src="js/qwerty.js"></script>
</body>
</html>
